[project]
name = "mcp-vul"
version = "0.1.0"
description = "Memory leak investigation control plane for MCP-based static/dynamic analyzers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "openai>=2.14.0",
    "mcp>=1.0.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-c>=0.23.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "tests/test_mcp_protocol.py",
    "tests/test_memory_leak_app.py",
    "tests/test_memory_leak_batch_runner.py",
    "tests/test_memory_leak_control_plane.py",
    "tests/test_memory_leak_judge.py",
    "tests/test_memory_leak_reporting.py",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
mcp-vul-memory-scan = "src.memory_leak.control_plane:main"
mcp-vul-memory-batch = "src.memory_leak.batch_runner:main"
mcp-vul-memory-compare = "src.memory_leak.compare_snapshots:main"
mcp-vul-memory-app = "src.memory_leak_app.server:main"
